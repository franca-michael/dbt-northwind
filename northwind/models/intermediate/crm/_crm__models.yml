models:
  - name: int_orders
    description: "Fact table of orders"
    columns:
      - name: order_id
        description: "Unique id of order"
        data_type: varchar
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign Key of customer"
        tests:
          - not_null
      - name: employee_id
        description: "Foreign Key of employee"
        tests:
          - not_null
      - name: order_date
        description: "Date of order"
        data_type: date
        tests:
          - not_null
      - name: required_date
        description: "Date of order"
        data_type: date
        tests:
          - not_null
      - name: shipped_date
        description: "Date of order"
        data_type: date
      - name: ship_via
        description: "Foreign Key of ship_via"
      - name: freight
        description: "Freight of order"
      - name: ship_name
        description: "Name of ship"
      - name: ship_address
        description: "Address of ship"
      - name: ship_city
        description: "City of ship"
      - name: ship_region
        description: "Region of ship"
      - name: ship_postal_code
        description: "Postal code of ship"
      - name: ship_country
        description: "Country of ship"