version: 2

models:
    - name: stg_customer
      description: "Client table"
      columns:
        - name: customer_id
          description: "Unique id of customer"
          tests:
            - unique
            - not_null
        - name: company_name
          description: "Name of company"
          tests:
            - not_null
    - name: stg_orders
      description: "Order table"
      columns:
        - name: order_id
          description: "Unique id of order"
          tests:
            - unique
            - not_null 
        - name: order_date
          description: "Date of order"
          tests:
            - not_null